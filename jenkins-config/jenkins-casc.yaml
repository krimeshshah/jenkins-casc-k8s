jenkins:
  systemMessage: "Jenkins configured automatically by Jenkins Configuration as Code plugin\n\n"

  numExecutors: 4
  mode: NORMAL

  nodes:
    - permanent:
        name: "static-agent"
        remoteFS: "/home/jenkins"
        numExecutors: 4
        launcher:
          inbound:
            workDirSettings:
              disabled: true
              failIfWorkDirIsMissing: false
              internalDir: "remoting"
              workDirPath: "/tmp"

  slaveAgentPort: 50000

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: ${JENKINS_ADMIN_ID}
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: builder
          password: builder123
    # github:
    #   apiUrl: "https://api.github.com"
    #   githubWebUri: "https://github.com"
    #   clientId: "${GITHUB_OAUTH_CLIENT_ID}"
    #   clientSecret: "${GITHUB_OAUTH_CLIENT_SECRET}"   # Could be loaded via credentials or env vars
    #   oauthScopes:
    #     - "read:org"
    #     - "user:email"

  
  # Authorization strategy
  authorizationStrategy:
    globalMatrix:
      entries:
        - user: 
            name: admin
            permissions:
              - "Overall/Administer"
        - user: 
            name: builder
            permissions:
              - "Job/Build"
              - "Job/Read"
    
unclassified:
  # Optional other global settings
  location:
    url: "https://jenkins.ks.ukinfosec.info" # Required for the image to spinned up to access jenkins over internet
    # url:  "http://172.17.0.1:8080" # UnComment it when need to build image to test in localmachine
  
