security:
   queueItemAuthenticator:
     authenticators:
     - global:
        strategy: triggeringUsersAuthorizationStrategy
  #  remotingSecurity:
  #     enabled: true           

jobs:
  - script: >
      pipelineJob('seed-job') {
        description('This seed job loads all DSL jobs from dslJobs/**/*.groovy')

        definition {
          cps {
            script("""\
              pipeline {
                agent any
                stages {
                  stage('Prepare DSL Files') {
                    steps {
                      sh 'cp -r /var/jenkins_home/dslJobs .'
                    }
                  }
                  stage('Generate DSL Jobs') {
                    steps {
                      jobDsl(
                        targets: 'dslJobs/**/*.groovy',
                        removedJobAction: 'DELETE',
                        removedViewAction: 'DELETE',
                        lookupStrategy: 'JENKINS_ROOT',
                        sandbox: true
                      )
                    }
                  }
                }
              }
            """)
            sandbox(true)
          }
        }
      }


